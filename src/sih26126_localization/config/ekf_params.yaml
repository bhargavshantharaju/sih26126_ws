# Local planar wheel odometry + IMU + visual odometry filter. SLAM remains the map->odom owner.
ekf_filter_node:
  ros__parameters:
    use_sim_time: true
    # Reduced from 30 to 20 Hz to reduce CPU contention under WSL2.
    # 30 Hz was triggering "Failed to meet update rate" errors when SLAM and
    # Gazebo were also running on the same host.  20 Hz is adequate for
    # odom->base_link TF publication with IMU at 100 Hz and odometry at ~17 Hz.
    frequency: 20.0
    sensor_timeout: 0.5
    two_d_mode: true

    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom
    publish_tf: true
    print_diagnostics: true
    debug: false

    # Covariances are supplied by ekf_sensor_adapter because the raw Gazebo
    # bridge reports all-zero covariance. Only vx and yaw rate are fused.
    odom0: /fusion/wheel_odometry
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  false, false,
                   false, false, true,
                   false, false, false]
    odom0_differential: false
    odom0_relative: false
    odom0_queue_size: 5

    # Visual odometry from RGB-D camera provides pose (x, y, yaw)
    # Covariance is quality-dependent from rgbd_odometry_baseline
    # DISABLED: Visual odometry appears to introduce drift that causes SLAM
    # map→odom corrections (0.46m jumps). Testing with visual odom disabled.
    # odom1: /fusion/visual_odometry
    # odom1_config: [true,  true,  false,
    #                false, false, true,
    #                false, false, false,
    #                false, false, false,
    #                false, false, false]
    # odom1_differential: false
    # odom1_relative: false
    # odom1_queue_size: 5

    # IMU yaw and yaw rate; no linear acceleration because Gazebo reports
    # gravity on z (9.8 m/s^2) and this simulated signal is not independently
    # validated for inertial integration.
    imu0: /fusion/imu
    imu0_config: [false, false, false,
                  false, false, true,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    imu0_differential: false
    imu0_relative: false
    imu0_queue_size: 10
    imu0_remove_gravitational_acceleration: false
