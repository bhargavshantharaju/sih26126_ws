# Local planar wheel odometry + IMU filter. SLAM remains the map->odom owner.
ekf_filter_node:
  ros__parameters:
    frequency: 30.0
    sensor_timeout: 0.1
    two_d_mode: true

    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom
    publish_tf: true
    print_diagnostics: true
    debug: false

    # Covariances are supplied by ekf_sensor_adapter because the raw Gazebo
    # bridge reports all-zero covariance. Only vx and yaw rate are fused.
    odom0: /fusion/wheel_odometry
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  false, false,
                   false, false, true,
                   false, false, false]
    odom0_differential: false
    odom0_relative: false
    odom0_queue_size: 5

    # IMU yaw and yaw rate; no linear acceleration because Gazebo reports
    # gravity on z (9.8 m/s^2) and this simulated signal is not independently
    # validated for inertial integration.
    imu0: /fusion/imu
    imu0_config: [false, false, false,
                  false, false, true,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    imu0_differential: false
    imu0_relative: false
    imu0_queue_size: 10
    imu0_remove_gravitational_acceleration: false
