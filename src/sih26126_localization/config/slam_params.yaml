slam_toolbox:
  ros__parameters:

    # Plugin params
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    # ROS Parameters - CONFIGURED FOR SIH_UGV
    odom_frame: odom
    map_frame: map
    base_frame: base_link
    scan_topic: /lidar/scan_2d
    use_map_saver: true
    mode: mapping

    # Use simulation time
    use_sim_time: true

    debug_logging: false
    # throttle_scans: 1 means process every scan; 2 means every-other-scan (5 Hz).
    # At 10 Hz LiDAR + WSL2 overhead, throttle_scans=1 fills the MessageFilter
    # queue faster than SLAM processes it.  Processing at ~5 Hz reduces queue
    # pressure and prevents repeated "discarding message because the queue is full"
    # drops that prevent the map from updating.
    throttle_scans: 2
    transform_publish_period: 0.02 #if 0 never publishes odometry
    map_update_interval: 2.0
    resolution: 0.05
    restamp_tf: false
    min_laser_range: 0.2 #match LiDAR spec
    max_laser_range: 20.0 #match LiDAR spec
    # minimum_time_interval controls the minimum elapsed sim-time between
    # keyframes.  With minimum_travel_distance=0.0 and minimum_travel_heading=0.0,
    # scans are accepted purely on time.  At 0.5s this allows ~2 keyframes/sec
    # while the robot is stationary, which is sufficient to build an initial map.
    minimum_time_interval: 0.5
    transform_timeout: 0.2
    tf_buffer_duration: 30.0
    stack_size_to_use: 40000000 #// program needs a larger stack size to serialize large maps
    enable_interactive_mode: true

    # General Parameters - tuned for outdoor navigation
    use_scan_matching: true
    use_scan_barycenter: true
    # Set to 0.0 to allow map growth while the robot is stationary at startup.
    # The startup deadlock was: robot stopped → SLAM travel thresholds not met →
    # map never grows past the initial 7×7 keyframe → no frontiers → no goal →
    # planner waits → safety supervisor stays STOPPED → deadlock.
    # With 0.0 thresholds SLAM accepts new scans purely based on minimum_time_interval
    # (0.5s).  Once the robot starts moving these thresholds become irrelevant
    # because any motion exceeds them quickly.
    minimum_travel_distance: 0.0
    minimum_travel_heading: 0.0
    check_min_dist_and_heading_precisely: false
    scan_buffer_size: 10
    scan_buffer_maximum_scan_distance: 10.0
    link_match_minimum_response_fine: 0.1
    link_scan_maximum_distance: 1.5
    loop_search_maximum_distance: 3.0
    do_loop_closing: true
    loop_match_minimum_chain_size: 10
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.35
    loop_match_minimum_response_fine: 0.45

    # Correlation Parameters - Correlation Parameters
    correlation_search_space_dimension: 0.5
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1

    # Correlation Parameters - Loop Closure Parameters
    loop_search_space_dimension: 8.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03

    # Scan Matcher Parameters
    distance_variance_penalty: 0.5
    angle_variance_penalty: 1.0

    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.349
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true